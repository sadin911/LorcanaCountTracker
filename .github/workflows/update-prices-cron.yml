name: Scheduled Card Prices Update

on:
  schedule:
    # Run everyday at 00:00 UTC (07:00 AM Bangkok time)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch and build latest card prices
        run: npm run data:prices

      - name: Commit and push price updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/market_prices.json src/data/market_prices.json
          if git diff --staged --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore(data): update daily market card prices [skip ci]"
            git push origin feature/card-pricing || git push origin main
          fi
