            "name": "Disney Lorcana Card Collection Tracker",
            "description": "The ultimate card collection tracker and binder inventory tool for Disney Lorcana TCG players and collectors.",

                "urlTemplate": "https://sadin911.github.io/LorcanaCountTracker/?search={search_term_string}"

    <!-- Decodes the redirect written by public/404.html (rafgraph/spa-github-pages) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
